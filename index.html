 if(/\.(xlsx|xls)$/.test(n)){const w=XLSX.read(b);return{text:w.SheetNames.map(s=>XLSX.utils.sheet_to_csv(w.Sheets[s])).join('\n'),imgs:[]}}
 if(/\.(csv|txt|xml)$/.test(n))return{text:new TextDecoder().decode(b),imgs:[]};
 if(f.type.startsWith('image/'))return{text:'',imgs:[f]};
 if(/\.pdf$/.test(n)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const p=await pdfjsLib.getDocument({data:b}).promise;let t='';
  for(let i=1;i<=p.numPages&&t.length<60000;i++){const g=await(await p.getPage(i)).getTextContent();let y=null;g.items.forEach(x=>{const yy=x.transform[5];t+=(y!=null&&Math.abs(yy-y)>3?'\n':' ')+x.str;y=yy});t+='\n'}
  if(t.replace(/\s/g,'').length>80)return{text:t,imgs:[]};
  const imgs=[];for(let i=1;i<=Math.min(p.numPages,3);i++){const pg=await p.getPage(i),v=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;imgs.push(await new Promise(r=>c.toBlob(r,'image/png')))}
  return{text:'',imgs}}
 throw Error('Формат не поддерживается: загрузите PDF, Excel, CSV, XML или фото')}
async function UP(f){if(!SM)return REV({lines:[{name:'',qty:1,manual:1}],err:'Автоматический разбор доступен только при открытии страницы в Claude. Сопоставьте строки вручную.'});
 LD('<b>Читаю документ…</b>');
 try{const{text,imgs}=await rd(f);LD('<b>Сопоставляю с позициями…</b><div class=mu>Это занимает до минуты. Если Claude попросит разрешение — разрешите.</div>');
  const list=S.items.map(x=>x.id+'|'+x.n+'|'+x.q).join('\n');
  const pr=`Ты разбираешь счёт, накладную или УПД для кофейни. Ниже ${imgs.length?'на изображениях':'текст'} документа и список ожидаемых позиций проекта (id|название|кол-во). Извлеки шапку документа и все товарные строки. Для каждой строки найди в списке подходящую позицию по виду товара и названию (бренд, модель и артикул важнее общих слов). Если подходящей позиции нет, id = null, не угадывай. Одной позиции — не более одной строки документа. Верни ТОЛЬКО JSON без пояснений и без markdown: {"supplier":"","number":"","date":"YYYY-MM-DD","lines":[{"name":"","qty":1,"id":123,"conf":0.9}]}\n\nПОЗИЦИИ:\n${list}\n\nДОКУМЕНТ:\n${text.slice(0,60000)}`;
  const o={modelTier:'default'};if(imgs.length)o.images=imgs;
  const r=await SM(pr,o);
  const j=JSON.parse(r.text.replace(/```json|```/g,'').replace(/^[^{]*/,'').replace(/[^}]*$/,''));
  REV(j)}catch(e){const M={not_granted:'Доступ к Claude не разрешён',rate_limited:'Слишком много запросов, подождите минуту',images_unavailable:'Отправка изображений недоступна'};REV({lines:[{name:'',qty:1,manual:1}],err:'Автоматический разбор не удался: '+(M[e.code]||e.message||e.code)+'. Сопоставьте строки вручную.'})}}
const lab=v=>v===''||v==null?'':v=='new'?'＋ создать позицию':(x=>x?`[${x.c}] ${x.n} · ${x.q} шт`:'')(S.items.find(y=>y.id==v));
const RW=(l,m)=>`<tr class=ul ${m?'':`data-n="${E(l.name)}"`}><td><input type=checkbox class=uc ${m||(l.id&&l.conf>=.6)?'checked':''}></td><td>${m?'<input class=un placeholder="Название строки из документа">':E(l.name)+`<div class=mu>${l.qty} шт${l.conf!=null?' · уверенность '+Math.round(l.conf*100)+'%':''}</div>`}</td><td><div class=cb><input class=cs placeholder="Найти позицию…" autocomplete=off><input type=hidden class=us></div></td><td><input type=number min=1 class=uq value=${+l.qty||1}></td></tr>`;
function setCb(r,v){r.querySelector('.us').value=v;r.querySelector('.cs').value=lab(v)}
function REV(j){const ls=j.lines||[];
 LD(`<b>Сопоставление с позициями</b> <span class=mu>${ls.length&&!ls[0].manual?'строк в документе: '+ls.length:'вручную'}</span>${j.err?`<div class=mu style="color:#d33;margin-top:4px">${E(j.err)}</div>`:''}
 <div class=g2><label>Поставщик<input id=u_sup value="${E(j.supplier)}"></label><label>№ УПД / счёта<input id=u_num value="${E(j.number)}"></label><label>Дата документа<input type=date id=u_dt value="${E(j.date)}"></label><label>Статус отмеченных позиций<select id=u_st>${ST.map((s,i)=>`<option value=${i} ${i==3?'selected':''}>${s}</option>`).join('')}</select></label><label>Выехало (для «в пути»)<input type=date id=u_ship></label><label>Прибытие (для «в пути»)<input type=date id=u_eta></label></div>
 <div class=rv><table><thead><tr><th></th><th>Строка документа</th><th>Позиция проекта (начните вводить для поиска)</th><th>Кол-во</th></tr></thead><tbody>${ls.map(l=>RW(l,l.manual)).join('')}</tbody></table></div><div id=ue class=mu style="color:#d33;margin-top:6px"></div>
 <div class=ac><span><button data-a=addr>＋ Строка вручную</button></span><span><button data-a=cx>Отмена</button> <button class=p data-a=uok>Применить</button></span></div><div id=pl class=pl hidden></div>`);
 document.querySelectorAll('#dlg tr.ul').forEach((r,i)=>{const id=ls[i]&&ls[i].id;setCb(r,id&&S.items.some(x=>x.id==id)?id:'')})}
let cu=null,ca=0;
function PL(q){const p=$('pl');if(!cu||!p){return}const t=q.toLowerCase().split(/\s+/).filter(Boolean),
 o=[['','— не сопоставлять —'],['new','＋ создать позицию']].concat(S.items.filter(x=>{const s=('['+x.c+'] '+x.n).toLowerCase();return t.every(w=>s.includes(w))}).slice(0,80).map(x=>[x.id,lab(x.id)]));
 p.innerHTML=o.map((z,i)=>`<div class="po${i==ca?' hv':''}" data-v="${z[0]}">${E(z[1])}</div>`).join('');
 const r=cu.getBoundingClientRect(),w=Math.max(r.width,380),b=innerHeight-r.bottom;p.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';p.style.width=w+'px';
 if(b>=200){p.style.top=r.bottom+2+'px';p.style.bottom='auto';p.style.maxHeight=Math.min(320,b-12)+'px'}else{p.style.bottom=innerHeight-r.top+2+'px';p.style.top='auto';p.style.maxHeight=Math.min(320,r.top-12)+'px'}
 p.hidden=false}
function pick(v){const t=cu;if(!t)return;t.parentNode.querySelector('.us').value=v;t.value=lab(v);const ck=t.closest('tr').querySelector('.uc');if(ck)ck.checked=v!=='';cu=null;$('pl').hidden=true;t.blur()}
const isCs=e=>e.target.classList&&e.target.classList.contains('cs');
document.addEventListener('focusin',e=>{if(isCs(e)){cu=e.target;ca=0;e.target.select();PL('')}});
document.addEventListener('input',e=>{if(isCs(e)){cu=e.target;ca=0;PL(e.target.value)}});
document.addEventListener('mousedown',e=>{const o=e.target.closest&&e.target.closest('.po');if(o&&cu){e.preventDefault();pick(o.dataset.v)}});
document.addEventListener('focusout',e=>{if(isCs(e)){const t=e.target;t.value=lab(t.parentNode.querySelector('.us').value);if(cu===t){cu=null;const p=$('pl');if(p)p.hidden=true}}});
document.addEventListener('keydown',e=>{if(!cu)return;const p=$('pl'),n=p.children.length;
 if(e.key=='ArrowDown')ca=Math.min(n-1,ca+1);else if(e.key=='ArrowUp')ca=Math.max(0,ca-1);else if(e.key=='Enter'){e.preventDefault();if(p.children[ca])pick(p.children[ca].dataset.v);return}else return;
 e.preventDefault();[...p.children].forEach((c,i)=>c.classList.toggle('hv',i==ca));if(p.children[ca])p.children[ca].scrollIntoView({block:'nearest'})});
function APPLY(){const g=k=>$(k).value.trim(),st=+$('u_st').value;let n=0;
 document.querySelectorAll('#dlg tr.ul').forEach(r=>{if(!r.querySelector('.uc').checked)return;const v=r.querySelector('.us').value,q=+r.querySelector('.uq').value||1;let x;
  if(v=='new'){const n=r.dataset.n||(r.querySelector('.un')||{}).value||'';if(!n)return;x={id:++S.seq,n,q,s:0,c:'Оборудование'};S.items.push(x)}
  else if(v){x=S.items.find(y=>y.id==v);if(!x)return;if(q<x.q){S.items.splice(S.items.indexOf(x)+1,0,{...x,id:++S.seq,q:x.q-q});x.q=q}else if(q>x.q)x.note=(x.note?x.note+'; ':'')+'в документе '+q+' шт, в проекте '+x.q}
  else return;
  x.s=st;x.sup=g('u_sup')||x.sup;x.upd=g('u_num')||x.upd;x.ud=g('u_dt')||x.ud;
  if(st==2){x.ship=g('u_ship')||x.ship||today;x.eta=g('u_eta')||x.eta}
  if(st==4&&!x.out)x.out=today;n++});
 if(!n){$('ue').textContent='Нет сопоставленных строк: выберите позицию в столбце «Позиция проекта» и поставьте галочку у строки';return}
 $('dlg').close();save();R();msg('Обновлено позиций: '+n)}
function setR(ids,v){S.items.forEach(x=>{if(ids.has(x.id)){x.r=v;if(v=='Подрядчик'&&x.s==0)x.s=5;if(v=='Денис К.'&&x.s==5)x.s=0}});save()}
function setS(ids,s){S.items.forEach(x=>{if(ids.has(x.id)){x.s=s;if(s==5&&!x.r)x.r='Подрядчик';if(s==4&&!x.out)x.out=today;if(s==2&&!x.ship)x.ship=today}});save()}
function ED(id){const x=id?S.items.find(i=>i.id==id):{n:'',q:1,s:0,c:f.c=='Все'?'Оборудование':f.c},d=$('dlg'),L=(l,k,t='text')=>`<label>${l}<input type=${t} id=f_${k} value="${E(x[k])}"></label>`;
 d.innerHTML=`<b>${id?'Редактировать':'Новая позиция'}</b>${L('Наименование','n')}<div class=g2>${L('Количество','q','number')}<label>Статус<select id=f_s>${ST.map((s,i)=>`<option value=${i} ${i==x.s?'selected':''}>${s}</option>`).join('')}</select></label>${L('Поставщик','sup')}${L('№ УПД','upd')}${L('Дата УПД','ud','date')}<label>Раздел<select id=f_c>${CATS.slice(1).map(k=>`<option ${k==x.c?'selected':''}>${k}</option>`).join('')}</select></label><label>Закупщик<select id=f_r>${RP.map(v=>`<option value="${v}" ${(x.r||'')==v?'selected':''}>${v||'—'}</option>`).join('')}</select></label>${L('Выехало','ship','date')}${L('Прибытие (ETA)','eta','date')}${L('Выехало со склада в кофейню','out','date')}</div>${L('Примечание (ячейка склада, комментарий)','note')}
 <div class=ac><span>${id?'<button data-a=del>Удалить</button>':''}</span><span><button data-a=cx>Отмена</button> <button class=p data-a=ok>Сохранить</button></span></div>`;d.className='';d.dataset.id=id||'';d.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='SELECT'||b.type=='checkbox')return;const a=b.dataset.a,i=+b.dataset.i,d=$('dlg');
 if(a=='upl'){$('up').click()}else if(a=='uok'){APPLY()}else if(a=='addr'){document.querySelector('#dlg tbody').insertAdjacentHTML('beforeend',RW({name:'',qty:1},1))}else if(a=='so'){const k=b.dataset.k;if(f.k==k){if(f.d>0)f.d=-1;else{f.k='';f.d=1}}else{f.k=k;f.d=1}R()}else if(a=='fr'){f.r=b.dataset.k;R()}else if(a=='bulkr'){setR(sel,$('br').value);sel.clear();R()}else if(a=='fc'){f.c=b.dataset.k;f.s=-1;sel.clear();R()}else if(a=='fs'){f.s=f.s===i?-1:i;R()}else if(a=='rs'){f.s=-1;f.q='';f.r='';f.k='';f.d=1;R()}
 else if(a=='ed')ED(i);
 else if(a=='bulk'){setS(sel,+$('bs').value);sel.clear();R()}else if(a=='clr'){sel.clear();T()}
 else if(a=='cx')d.close();else if(a=='del'){S.items=S.items.filter(y=>y.id!=d.dataset.id);d.close();save();R()}
 else if(a=='ok'){const g=k=>$('f_'+k).value.trim();if(!g('n'))return;let x=S.items.find(y=>y.id==d.dataset.id);if(!x){x={id:++S.seq};S.items.push(x)}
  Object.assign(x,{c:g('c'),r:g('r'),n:g('n'),q:+g('q')||1,s:+g('s'),sup:g('sup'),upd:g('upd'),ud:g('ud'),ship:g('ship'),eta:g('eta'),out:g('out'),note:g('note')});d.close();save();R()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,i=+t.dataset.i;if(t.id=='up'){if(t.files[0])UP(t.files[0]);t.value='';return}
 if(a=='st'){setS(new Set([i]),+t.value);R()}else if(a=='out'){S.items.find(y=>y.id==i).out=t.value;save();T()}else if(a=='rp'){setR(new Set([i]),t.value);R()}else if(a=='sel'){t.checked?sel.add(i):sel.delete(i);T()}
 else if(a=='all'){vis().forEach(x=>t.checked?sel.add(x.id):sel.delete(x.id));T()}});
R();
if(window.claude)claude.use('artifact').then(a=>{art=a;if(!a)msg('Режим просмотра')}).catch(()=>{});
</script>
</body></html>
